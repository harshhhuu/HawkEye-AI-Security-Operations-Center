apiVersion: v1
kind: ConfigMap
metadata:
  name: hawkeye-config
  namespace: hawkeye-soc
  labels:
    app: hawkeye-soc
data:
  AWS_DEFAULT_REGION: "us-east-1"
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  HAWKEYE_SAMPLE_SIZE: "2000"
  LOG_LEVEL: "INFO"
  CONTAMINATION_RATE: "0.15"
